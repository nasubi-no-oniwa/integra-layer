<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<title>インテグラ・レイヤー</title>
<meta name="description" content="倒れた誰かの欠片をつないで、全員で100階の塔を上るローグライク。">
<link rel="stylesheet" href="css/style.css?v=11">
<link rel="icon" href="img/icon.png">
<meta property="og:title" content="インテグラ・レイヤー">
<meta property="og:description" content="倒れた誰かの欠片をつないで、全員で100階の塔を上るローグライク。">
<meta property="og:image" content="https://nasubi-no-oniwa.github.io/integra-layer/img/ogp.png">
<meta property="og:url" content="https://nasubi-no-oniwa.github.io/integra-layer/">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="hud" hidden>
    <div class="hud-l">
      <canvas id="mini"></canvas>
    </div>
    <div class="hud-r">
      <div class="hud-floor"><b id="h-floor">1</b><span>階</span> <small id="h-biome"></small></div>
      <div class="hud-bar"><i id="h-hpbar"></i><span id="h-hp"></span></div>
      <div class="hud-small"><span id="h-lv"></span> <span id="h-gold"></span></div>
    </div>
  </div>
  <div id="pad" hidden>
    <div class="dpad">
      <button data-dir="0" class="up" aria-label="上">▲</button>
      <button data-dir="3" class="left" aria-label="左">◀</button>
      <button data-dir="1" class="right" aria-label="右">▶</button>
      <button data-dir="2" class="down" aria-label="下">▼</button>
    </div>
    <div class="abtn">
      <button id="b-menu" aria-label="メニュー">≡</button>
      <button id="b-act" class="big" aria-label="調べる">調べる</button>
    </div>
  </div>
  <div id="screen"></div>
  <div id="toast"></div>
  <div id="tut" hidden></div>
  <div id="rotate"><div class="ph"></div><p>スマホを<b>横向き</b>にして遊んでね</p><p class="small mute">画面の向きの固定（ロック）をはずしてから回してください</p></div>
</div>
<script>window.IL_BUILD = '11';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js?v=11"></script>
<script src="js/core.js?v=11"></script>
<script src="js/i18n.js?v=11"></script>
<script src="js/net.js?v=11"></script>
<script src="js/ui.js?v=11"></script>
</body>
</html>
