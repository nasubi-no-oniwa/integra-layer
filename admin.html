<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>インテグラ・レイヤー 管理</title>
<style>
:root{--bg:#0e0c14;--panel:#1c1826;--line:#3a3350;--ink:#ece6f5;--mute:#9a92ad;--pri:#7c5cd6;--warn:#d6455c;--ok:#4fae5a;--gold:#f2d14b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,sans-serif;padding:16px;max-width:1000px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 8px;color:var(--gold)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
button{background:#2a2438;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri)} button.warn{background:var(--warn);border-color:var(--warn)}
input,textarea{background:#0e0c14;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
table{width:100%;border-collapse:collapse;font-size:13px} td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.mute{color:var(--mute)} .ok{color:var(--ok)} .ng{color:var(--warn)} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{max-height:420px;overflow:auto} code{background:#000;padding:1px 5px;border-radius:4px;word-break:break-all}
</style>
</head>
<body>
<h1>インテグラ・レイヤー 管理ページ</h1>
<section id="me"><p class="mute">つないでいます…</p></section>
<section><h2>状況</h2><div id="online" class="ok">—</div><div id="stat" class="mute">—</div></section>
<section><h2>配信中の表示</h2>
  <div class="row"><label><input type="checkbox" id="st-on"> 配信中にする</label></div>
  <div class="row" style="margin-top:6px"><input id="st-url" placeholder="配信のURL（YouTube など）" style="flex:1;min-width:240px"><input id="st-txt" placeholder="ひとこと（例：30階に挑戦中）" style="flex:1;min-width:200px"><button class="pri" id="st-save">保存</button></div>
</section>
<section><h2>お知らせ（タイトル画面に出る）</h2>
  <div class="row"><input id="nw-txt" maxlength="200" placeholder="お知らせの文" style="flex:1;min-width:240px"><button class="pri" id="nw-add">出す</button></div>
  <div id="news" style="margin-top:8px"></div>
</section>
<section><h2>初撃破（最前線）の確認</h2>
  <p class="mute">「確かめる」で、その人の記録を最初から（そのときのルールの版で）再生して、本当にその階のボスを倒せるかを確かめます。同時撃破の人も確かめます。おかしい場合は「取り消す」か、プレイヤー一覧の「全部消す」。</p>
  <div class="row"><button id="fv-all">全部確かめる</button><span id="fv-msg" class="mute"></span></div>
  <div class="scroll"><table id="firsts"></table></div>
</section>
<section><h2>掲示板</h2>
  <p class="mute">通報が3つ以上ついた書きこみは、みんなの画面では自動で隠れます。</p>
  <div class="scroll"><table id="board"></table></div>
</section>
<section><h2>プレイヤー</h2><div class="scroll"><table id="players"></table></div></section>
<section><h2>お掃除</h2>
  <div class="row"><button id="cl-drops">古いバッグの控えを消す</button><button id="cl-board">60件より前の書きこみを消す</button><span id="cl-msg" class="mute"></span></div>
  <div class="row" style="margin-top:10px"><button id="cl-all" class="warn">公開前：全部消す</button><span class="mute">テストのデータを消すときだけ使う</span></div>
</section>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js?v=18"></script>
<script src="js/core.js?v=18"></script>
<script src="js/admin.js?v=18"></script>
</body>
</html>
